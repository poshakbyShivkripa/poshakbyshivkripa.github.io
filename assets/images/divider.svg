<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 140 30"
fill="none">

  <!-- Left Gradient Line -->

  <line
    x1="0"
    y1="15"
    x2="48"
    y2="15"

    stroke="url(#lineGradient)"
    stroke-width="1.5"

    stroke-linecap="round"/>

  <!-- Right Gradient Line -->

  <line
    x1="92"
    y1="15"
    x2="140"
    y2="15"

    stroke="url(#lineGradient)"
    stroke-width="1.5"

    stroke-linecap="round"/>

  <!-- Center Ornament -->

  <path
    d="M70 4
       L75 10
       L84 15
       L75 20
       L70 26
       L65 20
       L56 15
       L65 10
       Z"

    fill="url(#ornamentGradient)"/>

  <!-- Inner Diamond -->

  <path
    d="M70 10
       L74 15
       L70 20
       L66 15
       Z"

    fill="#fff8fb"/>

  <!-- Decorative Dots -->

  <circle cx="50" cy="15" r="2" fill="#d96ba7"/>
  <circle cx="90" cy="15" r="2" fill="#9b63c7"/>

  <!-- Gradients -->

  <defs>

    <linearGradient
      id="lineGradient"
      x1="0"
      y1="0"
      x2="140"
      y2="0">

      <stop offset="0%" stop-color="#f3d8e8"/>
      <stop offset="50%" stop-color="#d96ba7"/>
      <stop offset="100%" stop-color="#9b63c7"/>

    </linearGradient>

    <linearGradient
      id="ornamentGradient"
      x1="56"
      y1="4"
      x2="84"
      y2="26">

      <stop offset="0%" stop-color="#f0b5c2"/>
      <stop offset="50%" stop-color="#d96ba7"/>
      <stop offset="100%" stop-color="#9b63c7"/>

    </linearGradient>

  </defs>

</svg>