<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Shop authentic Rajasthani poshak, bridal wear, lehenga choli and traditional fashion from Poshak by Shivkripa.">
<meta name="keywords" content="Rajasthani Poshak, Rajputi Dress, Bandhani Dress, Lehenga Choli, Traditional Rajasthani Dress, Poshak by Shivkripa">
<meta name="author" content="Poshak by Shivkripa">

<title>Products | Poshak by Shivkripa</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<div id="header"></div>

<main class="products-page">

  <aside
    id="filter-container"
    class="filter-sidebar">
  </aside>

  <section class="product-list-section">

    <div class="product-list-header">
      <div>
        <h1>Products</h1>
        <p>All Items</p>
      </div>

      <label class="sort-control">
        <span>Sort By</span>
        <select
          data-sort-select
          aria-label="Sort products">
          <option value="default">Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating-high">Rating</option>
          <option value="name-az">Name: A to Z</option>
        </select>
      </label>
    </div>

    <div
      id="productGrid"
      class="product-grid">
    </div>

  </section>

  <div class="mobile-list-actions">
    <button
      class="mobile-filter-btn"
      type="button"
      aria-label="Open filters"
      onclick="toggleMobileFilters()">
      Filter
    </button>

    <button
      class="mobile-sort-btn"
      type="button"
      aria-label="Open sorting"
      onclick="toggleMobileSort()">
      Sort By
    </button>
  </div>

  <div
    id="mobile-sort-panel"
    class="mobile-sort-panel">

    <div class="sort-panel-header">
      <h2>Sort By</h2>
      <button
        class="sort-close-btn"
        type="button"
        aria-label="Close sorting"
        onclick="toggleMobileSort()">
        &times;
      </button>
    </div>

    <div class="sort-options">
      <button
        type="button"
        data-sort-option="default"
        onclick="selectMobileSort('default')">
        Featured
      </button>

      <button
        type="button"
        data-sort-option="price-low"
        onclick="selectMobileSort('price-low')">
        Price: Low to High
      </button>

      <button
        type="button"
        data-sort-option="price-high"
        onclick="selectMobileSort('price-high')">
        Price: High to Low
      </button>

      <button
        type="button"
        data-sort-option="rating-high"
        onclick="selectMobileSort('rating-high')">
        Rating
      </button>

      <button
        type="button"
        data-sort-option="name-az"
        onclick="selectMobileSort('name-az')">
        Name: A to Z
      </button>
    </div>
  </div>

</main>

<div id="footer"></div>

<script src="../scripts/components/header.js"></script>
<script src="../scripts/components/footer.js"></script>
<script src="../scripts/components/product-list/product-list.js"></script>
<script src="../scripts/components/product-list/product-filter.js"></script>
<script>
loadHeader();
loadFooter();
</script>
</body>
</html>
