<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>poshak by Shivkripa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff6f0, #ffe9dc);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #4a2c2a;
        }

        .container {
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        h1 span {
            color: #c97b63;
        }

        p.tagline {
            font-size: 16px;
            margin-bottom: 30px;
            color: #7a5c58;
        }

        .message {
            font-size: 20px;
            font-weight: 400;
            margin-top: 20px;
            line-height: 1.6;
        }

        .highlight {
            color: #c97b63;
            font-weight: 500;
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #a68a86;
        }

        .loader {
            margin: 25px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #f3d2c1;
            border-top: 4px solid #c97b63;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>poshak <span>by Shivkripa</span></h1>
        <p class="tagline">Celebrating Tradition with Elegance</p>

        <div class="loader"></div>

        <div class="message">
            Something beautiful is on its way... ✨<br>
            Stay curious, your <span class="highlight">perfect poshak</span> is being crafted.
        </div>

        <div class="footer">
            © 2026 poshak by Shivkripa
        </div>
    </div>

</body>
</html>
